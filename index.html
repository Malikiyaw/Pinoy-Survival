<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinoy Survival - Philippine Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; image-rendering: pixelated; image-rendering: crisp-edges; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ffcc00; font-size: 20px; z-index: 10; text-align: center; }
    #loading .bar { width: 200px; height: 4px; background: #333; margin: 10px auto 0; border-radius: 2px; overflow: hidden; }
    #loading .fill { width: 0%; height: 100%; background: #ffcc00; transition: width 0.3s; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
    <div id="loading">Loading...<div class="bar"><div class="fill" id="loadBar"></div></div><p id="loadMsg" style="color:#ff4444;font-size:12px;margin-top:8px;max-width:280px;line-height:1.4"></p></div>
  <canvas id="renderCanvas"></canvas>
  <script src="src/main.js"></script>
</body>
</html>
