<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinoy Survival - Philippine Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
    #renderCanvas {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
      touch-action: none; outline: none;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ffcc00; font-size: 20px;
      z-index: 10; text-align: center;
      pointer-events: none;
    }
    #loading .bar { width: 200px; height: 4px; background: #333; margin: 10px auto 0; border-radius: 2px; overflow: hidden; }
    #loading .fill { width: 0%; height: 100%; background: #ffcc00; transition: width 0.3s; }
    #loading .msg { color: #ff4444; font-size: 12px; margin-top: 8px; max-width: 320px; line-height: 1.4; }
    #loading .hint { color: #888; font-size: 11px; margin-top: 8px; }
    .gone { display: none !important; }
  </style>
  <script src="vendor/babylon/babylon.js"></script>
  <script src="vendor/babylon/gui.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading">
    Loading Pinoy Survival...
    <div class="bar"><div class="fill" id="loadBar"></div></div>
    <p class="msg" id="loadMsg"></p>
    <p class="hint" id="loadHint"></p>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
